apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: gorilla-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            # nginx's resolver ignores the search domains from
            # /etc/resolv.conf, so the bare name "api" - which works under
            # Docker Compose - does not resolve here. Potrzebny jest FQDN,
            # a namespace bierzemy z Downward API, żeby manifest działał
            # w dowolnym namespace bez edycji.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: API_UPSTREAM
              value: http://api.$(POD_NAMESPACE).svc.cluster.local:8000
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
