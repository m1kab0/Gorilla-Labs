apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: gorilla-api:latest
          # Obraz jest budowany i wgrywany lokalnie, nie ma go w żadnym
          # rejestrze - bez tego kubelet próbowałby go ściągnąć i utknął
          # na ErrImagePull.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: gorilla-secrets
          # /health nie dotyka bazy, więc nadaje się na sondy: restartowanie
          # aplikacji z powodu chwilowej niedostępności RDS-a tylko pogorszyłoby
          # sprawę.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  # Nazwa "api" jest wiążąca: nginx we frontendzie kieruje /api/ na
  # http://api:8000, a DNS klastra rozwiązuje nazwę Service'u.
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
