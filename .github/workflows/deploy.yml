name: Deploy

# Wdraża po każdym pushu na main — czyli po każdym zmergowanym PR-cie.
# Trust policy roli AWS_DEPLOY_ROLE_ARN dopuszcza logowanie wyłącznie z tego
# zdarzenia (repo:m1kab0/Gorilla-Labs:ref:refs/heads/main), więc żaden PR ani
# push na inną gałąź nie może przejąć tej roli, nawet gdyby ktoś podmienił
# ten plik w swojej gałęzi.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # wymagane do logowania AWS przez OIDC
  contents: read

env:
  AWS_REGION: eu-central-1
  INSTANCE_ID: i-029d618da3335486f

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wdrożenie przez SSM
        run: |
          set -euo pipefail

          # deploy.sh jest już na serwerze (ten sam commit go tam wgrał przy
          # poprzednim wdrożeniu) - woła go bezpośrednio jako użytkownik
          # ubuntu, bo tylko on ma docker w grupach i uprawnienia do repo.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/gym-app && ./deploy.sh\""]' \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)

          echo "=== stdout ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

          echo "=== stderr ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text

          echo "Status wdrożenia: $STATUS"
          [ "$STATUS" = "Success" ]
