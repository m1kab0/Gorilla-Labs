server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    # `expires` is deliberately not used here — it emits its own Cache-Control
    # header, so combining the two sends the response twice over.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker and its manifest must never be cached, or clients get
    # pinned to a stale build and stop picking up deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # The API, reverse-proxied under the same origin as the app. This is what
    # lets the production image be built with VITE_API_BASE_URL=/api: the
    # bundle then carries no hostname at all, so the same image works on any
    # IP or domain, only port 80 has to be open, and there is no cross-origin
    # request for CORS to get in the way of.
    #
    # Two things here are environment-dependent, so both are filled in at
    # container start rather than baked in:
    #
    #   API_UPSTREAM — Compose resolves the bare name `api`, but nginx's
    #     resolver does not apply /etc/resolv.conf's search list, so under
    #     Kubernetes this must be the FQDN (api.<namespace>.svc.cluster.local).
    #     Defaulted in the Dockerfile, overridden by k8s/web.yaml.
    #
    #   the resolver address itself — 127.0.0.11 under Compose, the CoreDNS
    #     service IP under Kubernetes. Written by docker-entrypoint.d/10-resolver.sh.
    #
    # The name is resolved per request rather than at startup, because a
    # literal hostname in proxy_pass makes nginx refuse to start when the
    # backend isn't there — which would break running this image on its own.
    location /api/ {
        set $api_backend ${API_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: /workouts, /plans, /exercises etc. are React Router
    # paths with no file behind them, so unmatched requests fall back to the
    # app shell. index.html itself stays uncached for the same reason as sw.js.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
