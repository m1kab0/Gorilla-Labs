<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Żelazo — dziennik treningowy</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand"><span class="plate-dot"></span>Dziennik treningowy</div>
    <div style="display:flex; align-items:center; gap:16px;">
      <button class="link" id="nav-exercises-btn" style="display:none;">Ćwiczenia</button>
      <button class="link" id="logout-btn" style="display:none;">Wyloguj</button>
    </div>
  </header>

  <!-- LOGOWANIE -->
  <section class="view" id="view-login">
    <h1 class="view-title">Zaloguj się</h1>
    <div class="error-banner" id="login-error"></div>
    <form id="login-form" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Hasło</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="primary">Zaloguj</button>
    </form>
    <div class="auth-switch">
      Nie masz konta? <button id="go-register">Zarejestruj się</button>
    </div>
  </section>

  <!-- REJESTRACJA -->
  <section class="view" id="view-register">
    <h1 class="view-title">Załóż konto</h1>
    <div class="error-banner" id="register-error"></div>
    <form id="register-form" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label for="register-name">Imię / nick</label>
        <input type="text" id="register-name" autocomplete="nickname">
      </div>
      <div class="field">
        <label for="register-email">Email</label>
        <input type="email" id="register-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="register-password">Hasło</label>
        <input type="password" id="register-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="primary">Utwórz konto</button>
    </form>
    <div class="auth-switch">
      Masz już konto? <button id="go-login">Zaloguj się</button>
    </div>
  </section>

  <!-- LISTA TRENINGÓW -->
  <section class="view" id="view-workouts">
    <h1 class="view-title">Twoje treningi</h1>
    <p class="view-subtitle" id="workouts-subtitle"></p>
    <div class="workout-list" id="workout-list"></div>
  </section>

  <!-- ĆWICZENIA (zarządzanie własnymi) -->
  <section class="view" id="view-exercises">
    <button class="back-link" id="exercises-back-to-list">← Wszystkie treningi</button>
    <h1 class="view-title">Twoje ćwiczenia</h1>
    <p class="view-subtitle">Dodawaj własne ćwiczenia — widzisz je tylko Ty, inni użytkownicy ich nie zobaczą.</p>

    <div class="field">
      <input type="text" id="exercises-page-search" placeholder="🔍 Szukaj ćwiczenia..." autocomplete="off">
    </div>

    <div class="add-set-panel">
      <div class="field">
        <label for="new-exercise-name">Nazwa ćwiczenia</label>
        <input type="text" id="new-exercise-name" placeholder="np. Wyciskanie hantli na skosie">
      </div>
      <div class="field">
        <label for="new-exercise-muscle">Partia mięśniowa (opcjonalnie)</label>
        <input type="text" id="new-exercise-muscle" placeholder="np. klatka piersiowa">
      </div>
      <button class="primary" id="create-exercise-btn">+ Dodaj ćwiczenie</button>
      <div class="error-banner" id="exercise-error"></div>
    </div>

    <div>
      <div class="exercise-header" style="border-radius:4px; margin-bottom:10px;">Twoje własne</div>
      <div id="own-exercise-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div>
      <div class="exercise-header" style="border-radius:4px; margin-bottom:10px;">Globalne (dostępne dla wszystkich)</div>
      <div id="global-exercise-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </section>

  <!-- SZCZEGÓŁY TRENINGU -->
  <section class="view" id="view-workout-detail">
    <button class="back-link" id="back-to-list">← Wszystkie treningi</button>
    <h1 class="view-title" id="workout-detail-date"></h1>
    <div id="exercise-groups" style="display:flex; flex-direction:column; gap:14px;"></div>

    <div class="add-set-panel">
      <div class="field">
        <label for="add-set-exercise">Ćwiczenie</label>
        <input type="text" id="add-set-exercise-search" placeholder="🔍 Szukaj ćwiczenia..." autocomplete="off">
        <select id="add-set-exercise"></select>
        <button type="button" class="link" id="quick-add-exercise-toggle" style="align-self:flex-start; padding:2px 0;">+ Nie ma Twojego ćwiczenia? Dodaj nowe</button>
      </div>

      <div class="field" id="quick-add-exercise-panel" style="display:none; border-top:1px solid var(--line); padding-top:12px;">
        <label for="quick-exercise-name">Nazwa nowego ćwiczenia</label>
        <input type="text" id="quick-exercise-name" placeholder="np. Wyciskanie hantli na skosie">
        <label for="quick-exercise-muscle" style="margin-top:8px;">Partia mięśniowa (opcjonalnie)</label>
        <input type="text" id="quick-exercise-muscle" placeholder="np. klatka piersiowa">
        <button type="button" class="secondary" id="quick-add-exercise-btn" style="margin-top:8px;">Dodaj i wybierz</button>
      </div>
      <div class="row-3">
        <div class="field">
          <label for="add-set-reps">Powtórzenia</label>
          <input type="number" id="add-set-reps" min="1" inputmode="numeric">
        </div>
        <div class="field">
          <label for="add-set-weight">Ciężar (kg)</label>
          <input type="number" id="add-set-weight" min="0" step="0.5" inputmode="decimal">
        </div>
        <div class="field">
          <label for="add-set-rpe">RPE</label>
          <input type="number" id="add-set-rpe" min="1" max="10" step="0.5" inputmode="decimal">
        </div>
      </div>
      <button class="primary" id="add-set-btn">Dodaj serię</button>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
